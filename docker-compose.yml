# requires REDIS_PASSWORD, e.g. in a .env file next to this one
services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # not published to the host, only reachable by pastebnn on the compose network
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pastebnn:
    image: evanofslack/pastebnn:latest
    restart: unless-stopped
    environment:
      PASTEBNN_APP_URL: "bin.mysite.com" # visual effect only
      PASTEBNN_MAX_SIZE_BYTES: 1048576 # 1MB
      PASTEBNN_STORAGE_BACKEND: "redis"
      PASTEBNN_REDIS_HOST: "redis"
      PASTEBNN_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # PASTEBNN_TRUST_PROXY: "true" # set when running behind a reverse proxy
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
